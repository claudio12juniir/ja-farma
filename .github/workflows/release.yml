name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      # max-parallel:1 (em vez de deixar os dois rodarem juntos): quando
      # macOS e Windows publicam pro mesmo tag ao mesmo tempo, cada um cria
      # seu próprio rascunho de release (electron-builder não enxerga o
      # rascunho que o outro job acabou de criar). Rodando em série, o
      # segundo job encontra e reaproveita o rascunho já criado pelo primeiro.
      max-parallel: 1
      matrix:
        os: [macos-15, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
